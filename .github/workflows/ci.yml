# CI do framework: cada pasta abaixo e um build Gradle independente (igual ao que uma equipe
# abre no VS Code). A biblioteca Ciprix e compilada e testada sozinha, e cada template/exemplo
# e compilado consumindo a Ciprix pelo codigo-fonte (composite build).
# Nao precisa de roboRIO: o build desktop do GradleRIO + HAL simulado cobrem os testes.
name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ciprix (biblioteca)
            dir: ciprix
          - name: Exemplo season-2026-rebuilt
            dir: examples/season-2026-rebuilt
          - name: Template skeleton
            dir: templates/skeleton
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: JDK 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Permissao do wrapper
        run: chmod +x gradlew

      # Roda antes do build de proposito: o build aplica o Spotless sozinho, entao checar
      # depois dele nunca falharia.
      - name: Spotless (formatacao)
        run: ./gradlew spotlessCheck

      # 'build' compila main + test e executa os testes JUnit.
      - name: Build + testes
        run: ./gradlew build --max-workers 2

      - name: Relatorios de teste
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ strategy.job-index }}
          path: |
            ${{ matrix.dir }}/**/build/reports/tests/
            ${{ matrix.dir }}/**/build/test-results/
          if-no-files-found: ignore

  release:
    name: CD - GitHub Release
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Gerar tag
        id: tag
        run: echo "tag=v$(date -u +'%Y.%m.%d').${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" >> $GITHUB_OUTPUT

      - name: Criar release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" --title "Release $TAG" --generate-notes
